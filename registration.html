<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/login.css">
    <link rel="stylesheet" href="styles/registration.css">
    <link rel="icon" href="img/fives_section/Social_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">    
    <script src="main.js" defer></script>
    <title>Login PetZen</title>
</head>
<body>
 <main>
    <div class="login-container container">
    <div class="login-bg-shape"></div>
    <div class="login-bg-shape-2"></div>
       
    <div>
        <h1 class="login-title">Login<span class="user-icon">👤</span></h1>
        <p class="login-subtitle">Log in to access your account</p>
    </div>

    <div class="login-logo">
        <span class="logo__pet">Pet</span><span class="logo__zen">Zen</span>
    </div>


    <form class="login-form" id="loginForm" action="login.html" method="POST">
                
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="form-options">
            <a href="#" class="forgot-password">Forgot your password?</a>
        </div>

        <button type="submit" class="btn btn--primary login-submit-btn">Access</button>
    </form>

        <div class="login-divider"><span>Or log in with</span></div>

        <div class="social-login">
        <button type="button" class="social-btn" aria-label="Login com Google">
                    
        <img src="img/registration/bt-google.png" alt="Google">
        </button>
        <button type="button" class="social-btn" aria-label="Login com Facebook">
                    
        <img src="img/registration/facebook.png" alt="Facebook">
        </button>
        </div>

        <p class="register-link">Don't have an account?<a href="login.html">  Sign up</a>
        </p>
    </div>
</main>


</body>
</html>

</body>
</html>
